<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiet Note｜号外 — プレビュー</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    @page {
      size: A4 portrait;
      margin: 15mm 18mm;
    }

    html, body {
      background: #ffffff;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN",
                   "Yu Gothic", "Meiryo", sans-serif;
      font-size: 11pt;
      line-height: 1.85;
      color: #1a1a1a;
      background: #ffffff;
      font-weight: 500;
    }

    .page {
      width: 174mm;
      min-height: 267mm;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      margin: 0 auto;
    }

    .page-header { padding-bottom: 4mm; }

    .label {
      font-size: 8pt;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 400;
      margin-bottom: 2.5mm;
      color: #1a1a1a;
    }

    .issue-title {
      font-size: 15pt;
      font-weight: 400;
      letter-spacing: 0.02em;
      line-height: 1.4;
      margin-bottom: 3mm;
    }

    .subheadline {
      font-size: 10.5pt;
      font-weight: 400;
      color: #333;
      letter-spacing: 0.03em;
      line-height: 1.9;
    }

    .rule {
      border: none;
      border-top: 0.5pt solid #1a1a1a;
      margin: 0;
    }

    .rule--header { margin-top: 5mm; margin-bottom: 5.5mm; }
    .rule--body   { margin-top: 5.5mm; margin-bottom: 5.5mm; }

    .body-columns {
      column-count: 2;
      column-gap: 7mm;
      column-fill: balance;
      overflow: hidden;
      flex: 0 0 auto;
    }

    .body-columns p {
      font-size: 11pt;
      line-height: 1.85;
      margin-bottom: 3mm;
      widows: 2;
      orphans: 2;
    }

    .body-columns p:last-child { margin-bottom: 0; }

    .lower-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      column-gap: 7mm;
      align-items: start;
    }

    .lower-block { display: flex; flex-direction: column; }

    .block-label {
      font-size: 9pt;
      font-weight: 500;
      letter-spacing: 0.08em;
      margin-bottom: 3mm;
      padding-bottom: 1.5mm;
      border-bottom: 0.5pt solid #1a1a1a;
    }

    .return-text {
      font-size: 10.5pt;
      line-height: 1.85;
      margin-bottom: 2.5mm;
    }

    .return-text:last-of-type { margin-bottom: 0; }

    .lower-block--qr { align-items: center; }

    /* QR プレースホルダー */
    .qr-area {
      width: 38mm;
      height: 38mm;
      border: 0.5pt dashed #bbb;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin-top: 1mm;
      gap: 2mm;
    }

    .qr-area .placeholder-icon {
      display: grid;
      grid-template-columns: repeat(5, 5px);
      grid-template-rows: repeat(5, 5px);
      gap: 1px;
    }

    .qr-area .placeholder-icon span {
      background: #ccc;
      border-radius: 0.5px;
    }

    .qr-area .placeholder-icon span.off {
      background: transparent;
    }

    .qr-label {
      font-size: 7pt;
      color: #aaa;
      letter-spacing: 0.1em;
    }

    .page-footer {
      margin-top: auto;
      padding-top: 5mm;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .footer-text {
      font-size: 8pt;
      font-weight: 400;
      color: #888;
      letter-spacing: 0.1em;
    }

    /* ロゴ プレースホルダー */
    .logo-placeholder {
      width: 24mm;
      height: 10mm;
      border: 0.5pt solid #ddd;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .logo-placeholder span {
      font-size: 7pt;
      color: #bbb;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    @media screen {
      body { background: #e8e8e4; padding: 20mm 0; }
      .page {
        background: #ffffff;
        padding: 15mm 18mm;
        box-shadow: 0 2px 16px rgba(0,0,0,0.12);
      }
    }

    @media print {
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      html, body { background: #ffffff; padding: 0; margin: 0; }
      .page { width: 174mm; box-shadow: none; padding: 0; margin: 0; }
      .body-columns { line-height: 1.8; }
      .page-header, .lower-block, .lower-row, .page-footer {
        break-inside: avoid;
        page-break-inside: avoid;
      }
    }
  </style>
</head>
<body>
  <article class="page">

    <header class="page-header">
      <p class="label">Quiet Note</p>
      <h1 class="issue-title">号外</h1>
      <p class="subheadline">戻る場所は、<br>外ではなく、<br>自分の中にある。</p>
    </header>

    <hr class="rule rule--header">

    <section class="body-columns">
      <p>最近、<br><br>何をやればいいのか分からない。<br>身体も、気持ちも、少し重い。<br><br>そんな声を、<br>よく聞くようになりました。</p>
      <p>でも、<br><br>本当に必要なのは、<br>新しい刺激ではなく、<br><br>"戻れる場所"<br><br>なのかもしれません。</p>
      <p>整うと、<br>感覚は少しずつ戻ってきます。</p>
      <p>強さは、<br>外から足すものではなく、<br><br>もともと持っているものが、<br>通り始めること。</p>
    </section>

    <hr class="rule rule--body">

    <div class="lower-row">

      <section class="lower-block lower-block--return">
        <h2 class="block-label">The Return</h2>
        <p class="return-text">気が向いた日に届く、<br>ほぼ毎日の短いメール。</p>
        <p class="return-text">コーヒーが冷める前に、読み終わる。<br>でも、少し残る。</p>
      </section>

      <section class="lower-block lower-block--qr">
        <h2 class="block-label" style="width:100%; text-align:center; letter-spacing:0;">　</h2>
        <div class="qr-area">
          <!-- QR コードのビジュアルプレースホルダー -->
          <div class="placeholder-icon">
            <span></span><span></span><span></span><span></span><span></span>
            <span></span><span class="off"></span><span></span><span class="off"></span><span></span>
            <span></span><span></span><span class="off"></span><span></span><span></span>
            <span></span><span class="off"></span><span></span><span class="off"></span><span></span>
            <span></span><span></span><span></span><span></span><span></span>
          </div>
          <p class="qr-label">qr.png</p>
        </div>
      </section>

    </div>

    <footer class="page-footer">
      <p class="footer-text">静かな強さへ。</p>
      <div class="logo-placeholder">
        <span>logo</span>
      </div>
    </footer>

  </article>
</body>
</html>
